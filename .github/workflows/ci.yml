name: CI

on:
  push:
    branches: [ master, "build/**" ]
  pull_request:
    branches: [ master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test
        run: mvn --batch-mode test
      - name: Package
        run: mvn --batch-mode -DskipTests package
